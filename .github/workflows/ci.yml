name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-release:
    name: Check and release audit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SOURCE_DATE_EPOCH: "1704067200"

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Show toolchain
        run: |
          python --version
          node --version

      - name: Check required project files
        run: python -c "from tools.check_project import check_required_files; print(check_required_files())"

      - name: Check version metadata
        run: python -c "from tools.check_project import check_version; print(check_version())"

      - name: Check Python syntax
        run: python -c "from tools.check_project import check_python_syntax; print(check_python_syntax())"

      - name: Check JavaScript syntax
        run: python -c "from tools.check_project import check_javascript_syntax; print(check_javascript_syntax())"

      - name: Check JavaScript module bindings
        run: python -c "from tools.check_project import check_javascript_bindings; print(check_javascript_bindings())"

      - name: Check startup scripts and plist
        run: python -c "from tools.check_project import check_shell_and_plist; print(check_shell_and_plist())"

      - name: Check development dependencies
        run: python -c "from tools.check_project import check_dev_requirements; print(check_dev_requirements())"

      - name: Check asset provenance
        run: python -c "from tools.check_project import check_asset_provenance; print(check_asset_provenance())"

      - name: Check theme registry
        run: python -c "from tools.check_project import check_themes; print(check_themes())"

      - name: Check static references and modules
        run: python -c "from tools.check_project import check_static_references; print(check_static_references())"

      - name: Check generated icons
        run: python -c "from tools.check_project import check_generated_icons; print(check_generated_icons())"

      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py" -q

      - name: Run JavaScript tests
        run: python -c "from pathlib import Path; import subprocess, sys; files=[str(path) for path in sorted(Path('tests/js').glob('*.test.mjs'))]; raise SystemExit(subprocess.run(['node', '--test', *files]).returncode)"

      - name: Build and verify release
        shell: bash
        run: |
          python tools/build_release.py --dist dist
          python tools/build_release.py --dist dist --verify-only
          python -c "from pathlib import Path; import os, shutil; src=next(Path('dist').glob('console-*.zip')); shutil.copyfile(src, Path(os.environ['RUNNER_TEMP']) / 'console-first.zip')"
          python tools/build_release.py --dist dist
          python -c "from pathlib import Path; import os; outputs=list(Path('dist').glob('console-*.zip')); assert len(outputs) == 1 and Path(os.environ['RUNNER_TEMP'], 'console-first.zip').read_bytes() == outputs[0].read_bytes(), 'release archive is not reproducible'"
          python tools/build_release.py --dist dist --verify-only
