name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-release:
    name: Check and release audit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      SOURCE_DATE_EPOCH: "1704067200"

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Show toolchain
        run: |
          python --version
          node --version

      - name: Check required project files
        run: python -c "from pathlib import Path; root=Path('.'); names=['VERSION','README.md','CHANGELOG.md','LICENSE','SECURITY.md','CONTRIBUTING.md','CODE_OF_CONDUCT.md','ASSET_PROVENANCE.md','THIRD_PARTY_NOTICES.md','RELEASE_CHECKLIST.md','requirements-dev.txt','Makefile','server.py','start.command','start.bat','总控台.vbs']; missing=[name for name in names if not (root / name).is_file()]; assert not missing, 'missing project files=' + ', '.join(missing)"

      - name: Check required workflow files
        run: python -c "from pathlib import Path; root=Path('.'); names=['.github/workflows/ci.yml','.github/ISSUE_TEMPLATE/config.yml','.github/ISSUE_TEMPLATE/bug_report.yml','.github/ISSUE_TEMPLATE/feature_request.yml','.github/PULL_REQUEST_TEMPLATE.md']; missing=[name for name in names if not (root / name).is_file()]; assert not missing, 'missing workflow files=' + ', '.join(missing)"

      - name: Check required source and screenshot files
        run: python -c "from pathlib import Path; root=Path('.'); names=['tests/test_server.py','docs/screenshots/ops-launchpad.jpg','docs/screenshots/ops-services.jpg','static/index.html','static/app.js']; missing=[name for name in names if not (root / name).is_file()]; assert not missing, 'missing source files=' + ', '.join(missing)"

      - name: Check macOS app bundle files
        run: python -c "from pathlib import Path; root=Path('.'); names=['总控台.app/Contents/Info.plist','总控台.app/Contents/MacOS/launcher']; missing=[name for name in names if not (root / name).is_file()]; assert not missing, 'missing macOS files=' + ', '.join(missing)"

      - name: Check version metadata
        run: python -c "from tools.check_project import check_version; print(check_version())"

      - name: Check Python syntax - server
        run: python -c "from pathlib import Path; import ast; path=Path('server.py'); ast.parse(path.read_text(encoding='utf-8'), filename=str(path))"

      - name: Check Python syntax - build release
        run: python -c "from pathlib import Path; import ast; path=Path('tools/build_release.py'); ast.parse(path.read_text(encoding='utf-8'), filename=str(path))"

      - name: Check Python syntax - project checker
        run: python -c "from pathlib import Path; import ast; path=Path('tools/check_project.py'); ast.parse(path.read_text(encoding='utf-8'), filename=str(path))"

      - name: Check Python syntax - brand assets
        run: python -c "from pathlib import Path; import ast; path=Path('tools/gen_brand_assets.py'); ast.parse(path.read_text(encoding='utf-8'), filename=str(path))"

      - name: Check Python syntax - icon generator
        run: python -c "from pathlib import Path; import ast; path=Path('tools/gen_icons.py'); ast.parse(path.read_text(encoding='utf-8'), filename=str(path))"

      - name: Check Python syntax - frontend tests
        run: python -c "from pathlib import Path; import ast; path=Path('tests/test_frontend.py'); ast.parse(path.read_text(encoding='utf-8'), filename=str(path))"

      - name: Check Python syntax - hardening tests
        run: python -c "from pathlib import Path; import ast; path=Path('tests/test_hardening.py'); ast.parse(path.read_text(encoding='utf-8'), filename=str(path))"

      - name: Check Python syntax - project checks tests
        run: python -c "from pathlib import Path; import ast; path=Path('tests/test_project_checks.py'); ast.parse(path.read_text(encoding='utf-8'), filename=str(path))"

      - name: Check Python syntax - release tests
        run: python -c "from pathlib import Path; import ast; path=Path('tests/test_release.py'); ast.parse(path.read_text(encoding='utf-8'), filename=str(path))"

      - name: Check Python syntax - server tests
        run: python -c "from pathlib import Path; import ast; path=Path('tests/test_server.py'); ast.parse(path.read_text(encoding='utf-8'), filename=str(path))"

      - name: Check JavaScript syntax - app
        run: node --check static/app.js

      - name: Check JavaScript syntax - icons
        run: node --check static/icons.js

      - name: Check JavaScript syntax - core
        run: node --check static/js/core.js

      - name: Check JavaScript syntax - launchpad
        run: node --check static/js/launchpad.js

      - name: Check JavaScript syntax - overlays
        run: node --check static/js/overlays.js

      - name: Check JavaScript syntax - ports
        run: node --check static/js/ports.js

      - name: Check JavaScript syntax - services
        run: node --check static/js/services.js

      - name: Check JavaScript syntax - widgets
        run: node --check static/js/widgets.js

      - name: Check JavaScript bindings - app
        run: python -c "from pathlib import Path; from tools.check_project import javascript_exported_callables, find_unbound_shared_calls; core=Path('static/js/core.js').read_text(encoding='utf-8'); path=Path('static/app.js'); missing=find_unbound_shared_calls(path.read_text(encoding='utf-8'), javascript_exported_callables(core)); assert not missing, 'missing bindings=' + ', '.join(missing)"

      - name: Check JavaScript bindings - icons
        run: python -c "from pathlib import Path; from tools.check_project import javascript_exported_callables, find_unbound_shared_calls; core=Path('static/js/core.js').read_text(encoding='utf-8'); path=Path('static/icons.js'); missing=find_unbound_shared_calls(path.read_text(encoding='utf-8'), javascript_exported_callables(core)); assert not missing, 'missing bindings=' + ', '.join(missing)"

      - name: Check JavaScript bindings - launchpad
        run: python -c "from pathlib import Path; from tools.check_project import javascript_exported_callables, find_unbound_shared_calls; core=Path('static/js/core.js').read_text(encoding='utf-8'); path=Path('static/js/launchpad.js'); missing=find_unbound_shared_calls(path.read_text(encoding='utf-8'), javascript_exported_callables(core)); assert not missing, 'missing bindings=' + ', '.join(missing)"

      - name: Check JavaScript bindings - overlays
        run: python -c "from pathlib import Path; from tools.check_project import javascript_exported_callables, find_unbound_shared_calls; core=Path('static/js/core.js').read_text(encoding='utf-8'); path=Path('static/js/overlays.js'); missing=find_unbound_shared_calls(path.read_text(encoding='utf-8'), javascript_exported_callables(core)); assert not missing, 'missing bindings=' + ', '.join(missing)"

      - name: Check JavaScript bindings - ports
        run: python -c "from pathlib import Path; from tools.check_project import javascript_exported_callables, find_unbound_shared_calls; core=Path('static/js/core.js').read_text(encoding='utf-8'); path=Path('static/js/ports.js'); missing=find_unbound_shared_calls(path.read_text(encoding='utf-8'), javascript_exported_callables(core)); assert not missing, 'missing bindings=' + ', '.join(missing)"

      - name: Check JavaScript bindings - services
        run: python -c "from pathlib import Path; from tools.check_project import javascript_exported_callables, find_unbound_shared_calls; core=Path('static/js/core.js').read_text(encoding='utf-8'); path=Path('static/js/services.js'); missing=find_unbound_shared_calls(path.read_text(encoding='utf-8'), javascript_exported_callables(core)); assert not missing, 'missing bindings=' + ', '.join(missing)"

      - name: Check JavaScript bindings - widgets
        run: python -c "from pathlib import Path; from tools.check_project import javascript_exported_callables, find_unbound_shared_calls; core=Path('static/js/core.js').read_text(encoding='utf-8'); path=Path('static/js/widgets.js'); missing=find_unbound_shared_calls(path.read_text(encoding='utf-8'), javascript_exported_callables(core)); assert not missing, 'missing bindings=' + ', '.join(missing)"

      - name: Check Windows launchers
        if: runner.os == 'Windows'
        run: python -c "from pathlib import Path; root=Path('.'); names=['start.bat','总控台.vbs']; assert all((root / name).is_file() and (root / name).stat().st_size > 0 for name in names)"

      - name: Check Info.plist
        run: python -c "from pathlib import Path; import plistlib; plistlib.loads((Path('总控台.app') / 'Contents' / 'Info.plist').read_bytes())"

      - name: Check macOS startup scripts
        if: runner.os == 'macOS'
        run: python -c "from tools.check_project import check_shell_and_plist; print(check_shell_and_plist())"

      - name: Check development dependencies
        run: python -c "from pathlib import Path; import re; lines=[line.strip() for line in Path('requirements-dev.txt').read_text(encoding='utf-8').splitlines() if line.strip() and not line.lstrip().startswith('#')]; assert lines; unpinned=[line for line in lines if not re.fullmatch(r'[A-Za-z0-9_.-]+==[A-Za-z0-9_.+!-]+', line)]; assert not unpinned, 'unpinned dependencies=' + ', '.join(unpinned)"

      - name: Check asset provenance
        run: python -c "from pathlib import Path; import hashlib; path=Path('static/assets/console-app-icon.png'); text=Path('ASSET_PROVENANCE.md').read_text(encoding='utf-8'); assert path.as_posix() in text and hashlib.sha256(path.read_bytes()).hexdigest() in text"

      - name: Check asset provenance - brand mark
        run: python -c "from pathlib import Path; import hashlib; path=Path('static/assets/brand-mark.png'); text=Path('ASSET_PROVENANCE.md').read_text(encoding='utf-8'); assert path.as_posix() in text and hashlib.sha256(path.read_bytes()).hexdigest() in text"

      - name: Check asset provenance - favicon png
        run: python -c "from pathlib import Path; import hashlib; path=Path('static/assets/favicon-32.png'); text=Path('ASSET_PROVENANCE.md').read_text(encoding='utf-8'); assert path.as_posix() in text and hashlib.sha256(path.read_bytes()).hexdigest() in text"

      - name: Check asset provenance - favicon ico
        run: python -c "from pathlib import Path; import hashlib; path=Path('static/assets/favicon.ico'); text=Path('ASSET_PROVENANCE.md').read_text(encoding='utf-8'); assert path.as_posix() in text and hashlib.sha256(path.read_bytes()).hexdigest() in text"

      - name: Check asset provenance - apple touch icon
        run: python -c "from pathlib import Path; import hashlib; path=Path('static/assets/apple-touch-icon.png'); text=Path('ASSET_PROVENANCE.md').read_text(encoding='utf-8'); assert path.as_posix() in text and hashlib.sha256(path.read_bytes()).hexdigest() in text"

      - name: Check asset provenance - Geist Mono
        run: python -c "from pathlib import Path; import hashlib; path=Path('static/fonts/GeistMono-Variable.woff2'); text=Path('ASSET_PROVENANCE.md').read_text(encoding='utf-8'); assert path.as_posix() in text and hashlib.sha256(path.read_bytes()).hexdigest() in text"

      - name: Check asset provenance - macOS app icon
        run: python -c "from pathlib import Path; import hashlib; path=Path('总控台.app/Contents/Resources/AppIcon.icns'); text=Path('ASSET_PROVENANCE.md').read_text(encoding='utf-8'); assert path.as_posix() in text and hashlib.sha256(path.read_bytes()).hexdigest() in text"

      - name: Check theme registry
        run: python -c "from tools.check_project import check_themes; print(check_themes())"

      - name: Check static resource references
        run: python -c "from tools.check_project import check_static_resource_references; print(check_static_resource_references())"

      - name: Check local module imports
        run: python -c "from tools.check_project import check_local_module_imports; print(check_local_module_imports())"

      - name: Check generated icons
        if: runner.os == 'macOS'
        run: python -c "from tools.check_project import check_generated_icons; print(check_generated_icons())"

      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py" -q

      - name: Run JavaScript tests
        run: python -c "from pathlib import Path; import subprocess, sys; files=[str(path) for path in sorted(Path('tests/js').glob('*.test.mjs'))]; raise SystemExit(subprocess.run(['node', '--test', *files]).returncode)"

      - name: Build release archive
        shell: bash
        run: |
          python - <<'PY'
          import runpy
          import sys

          sys.argv = ["tools/build_release.py", "--dist", "dist"]
          try:
              runpy.run_path("tools/build_release.py", run_name="__main__")
          except SystemExit as exc:
              if exc.code not in (None, 0):
                  print(f"::error file=tools/build_release.py,line=1::release build failed: {exc}")
                  raise

      - name: Verify release archive
        run: python tools/build_release.py --dist dist --verify-only

      - name: Snapshot release archive
        run: python -c "from pathlib import Path; import os, shutil; src=next(Path('dist').glob('console-*.zip')); shutil.copyfile(src, Path(os.environ['RUNNER_TEMP']) / 'console-first.zip')"

      - name: Rebuild release archive
        run: python tools/build_release.py --dist dist

      - name: Compare reproducible release archive
        run: python -c "from pathlib import Path; import os; outputs=list(Path('dist').glob('console-*.zip')); assert len(outputs) == 1 and Path(os.environ['RUNNER_TEMP'], 'console-first.zip').read_bytes() == outputs[0].read_bytes(), 'release archive is not reproducible'"

      - name: Verify rebuilt release archive
        run: python tools/build_release.py --dist dist --verify-only
